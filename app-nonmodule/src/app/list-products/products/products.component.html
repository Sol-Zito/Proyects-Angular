<div>
  <ul class="list-group">
    <li
      *ngFor="let producto of productos; index as i"
      class="list-group-item text-center"
    >
      Nombre: {{ producto.nombre.toUpperCase() }}, Precio: ${{
        producto.precio
      }}
    </li>
  </ul>

  <div>
    <div class="mt-3 d-flex justify-content-center input-group mb-3 gap-2">
      <input
        type="text"
        #descripcionInput
        placeholder="Descripcion:"
        class="form-control mb-2"
      />
      <input
        type="number"
        #precioInput
        placeholder="Precio:"
        class="form-control mb-2"
      />
    </div>
    <div class="mt-3 d-flex justify-content-center">
      <button
        (click)="agregarProducto(descripcionInput.value, +precioInput.value)"
        class="btn btn-primary w-50"
      >
        Agregar tarea
      </button>
    </div>
  </div>
</div>
